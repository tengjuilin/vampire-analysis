[project]
name = "vampire-analysis"
version = "1.0.0"
description = "VAMPIRE (Visually Aided Morpho-Phenotyping Image Recognition): quantify and visualize heterogeneity of cell and nucleus morphology with a scikit-learn-style API."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Teng-Jui Lin", email = "lintengjui@outlook.com" }]
requires-python = ">=3.13"
keywords = ["morphology", "image analysis", "cell shape", "scikit-learn", "microscopy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/tengjuilin/vampire-analysis"
Documentation = "https://vampire.readthedocs.io"
Source = "https://github.com/tengjuilin/vampire-analysis"
Issues = "https://github.com/tengjuilin/vampire-analysis/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.6", "pre-commit>=3.8"]
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "numpydoc>=1.8",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-llms-txt>=0.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vampire"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib", "-ra"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["vampire"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "PD", "SIM", "RUF", "D"]
ignore = [
    "RUF002", # allow unicode (e.g. ×) in docstrings
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]
# Math-style uppercase matrix names (A, R, U, V) mirror the published method.
"src/vampire/_linalg.py" = ["N806"]
"src/vampire/contours.py" = ["N806"]
